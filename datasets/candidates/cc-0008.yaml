summary: verify-page logs one console error per viewport on any output with an external stylesheet — its font check (DevTools CSS domain) makes Chromium re-request the stylesheet outside Playwright routing and the egress proxy answers 405. Ignore those requests or serve local pages from a real loopback server. One treatment run inlined its CSS to silence the error; a verifier must not push authors toward worse structure.
