      observations:
        - ref-007.typography.home-1440-display-tracking
      note: utilitarian system keeps 0 tracking at 64 px; legibility-first choice
  validation: []
  external:
    - source_id: rtlstyling-shadeed
      note: no letter-spacing on Arabic
evidence_count: 5
confidence: medium
confidence_basis: 5 independent references (measured); validation pending
