id: rtl.test-line-breaks-per-language
kind: principle
domain: rtl
title: Size for the longer language and check each language's breaks
status: provisional
since: 0.1.0
statement: "Do not assume line-count parity between Arabic and English: lay out display text and buttons for the longer language and verify breaks in each language at 390 and 1440."
when:
  language:
    - bilingual
consider:
  - flexible heights for headlines and buttons
  - "per-language line-break tweaks (text-wrap: balance)"
verify:
  - line counts per language at 390/1440
  - no truncated CTA labels
avoid_when: []
rationale: Arabic needed three lines where English needed two on the luxury storefront; on the fintech, the Arabic headline fit one line at 1440 where English took two.
