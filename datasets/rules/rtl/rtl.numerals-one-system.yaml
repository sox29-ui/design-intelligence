id: rtl.numerals-one-system
kind: principle
domain: rtl
title: Choose one numeral system deliberately and apply it everywhere
status: provisional
since: 0.1.0
statement: Decide between Western (0–9) and Arabic-Indic (٠–٩) digits for the audience and context, then use that system consistently for prices, dates, ratings and counts; digits always run left-to-right inside RTL text.
when:
  language:
    - ar
    - bilingual
consider:
  - Western digits are what the Gulf commerce/fintech references use
  - Arabic-Indic digits for traditional or editorial contexts if the audience expects them
  - Intl.NumberFormat with the chosen numbering system
verify:
  - no mixed numeral systems on one page
  - prices with currency read correctly in RTL (bidi)
avoid_when: []
rationale: All three Arabic references use Western digits consistently (VERIFIED zero Arabic-Indic digits); W3C notes several digit systems in use, including Arabic-Indic in parts of the region.
trade_offs: []
depends_on:
  - language
  - industry
evidence:
  supporting:
    - ref: ref-010
      observations:
        - ref-010.rtl.home-ar-1440-digits
        - ref-010.rtl.home-ar-a-why-western-digits
    - ref: ref-011
      observations:
        - ref-011.rtl.home-1440-digits
    - ref: ref-012
      observations:
        - ref-012.rtl.home-ar-1440-digits
  counterexamples: []
  validation:
    - ref: val-002
      result: consistent
      observations:
        - val-002.rtl.home-ar-1440-digits
      note: "auto (home-ar): digits: 36 Western, 0 Arabic-Indic"
  external:
    - source_id: w3c-alreq
      note: digit systems; digits laid out left-to-right
    - source_id: rtlstyling-shadeed
      note: "be consistent: either Hindi or Arabic numerals"
evidence_count: 3
confidence: medium
confidence_basis: 3 independent references + 2 sources
created: 2026-10-02
updated: 2026-10-04
history:
