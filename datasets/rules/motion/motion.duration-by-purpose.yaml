id: motion.duration-by-purpose
kind: principle
domain: motion
title: "Duration follows purpose: feedback fast, choreography slow"
status: provisional
since: 0.1.0
statement: Use 100–300 ms for state feedback (hover, focus, open/close) and reserve 600–1500 ms for narrative choreography in story sections; never make task feedback wait on choreography.
when:
  motion_budget:
    - subtle
    - expressive
consider:
  - "tokens: --dur-fast 120ms, --dur-base 200–300ms, --dur-slow 700ms+ (story only)"
  - ease-out for entrances, ease-in-out for state changes
verify:
  - transition-duration median ≤ 300 ms on interactive elements (verify-page)
  - no interaction blocked by an animation
avoid_when: []
rationale: Median transition durations are 200–300 ms on task, editorial, commerce and conversion references; 750–1500 ms appears on the personal-brand and brand-guidelines sites for scroll choreography.
trade_offs: []
depends_on:
  - motion-budget
  - user-intent
evidence:
