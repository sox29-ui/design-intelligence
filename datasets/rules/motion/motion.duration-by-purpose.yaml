      result: consistent
      observations:
        - val-002.motion.home-ar-1440-transition-duration
      note: "auto (home-ar): median transition 350 ms on a task/information/commerce page (rule: ≈200–300 ms)"
  external: []
evidence_count: 8
confidence: high
confidence_basis: 8 independent references across 6 archetypes (measured durations); consistent on val-001 and val-002 (measured)
