id: antipattern.content-gating-preloader
kind: anti-pattern
domain: motion
title: Branded preloader that gates content
status: provisional
since: 0.1.0
statement: A full-screen preloader that hides content for seconds hides cost rather than removing it; stream content progressively and reserve preloaders for experiences that cannot start without assets.
when:
  page_goal:
    - any
consider:
  - progressive rendering; skeletons for real loading only
  - poster frames for heavy media
verify:
  - "entrance frames: real content visible within ~1–2 s in the lab"
  - LCP estimate
avoid_when: []
rationale: The personal-brand site still showed its full-screen lime preloader 4.2 s after navigation in the lab.
trade_offs: []
depends_on:
  - engineering-budget
evidence:
  supporting:
    - ref: ref-001
      observations:
        - ref-001.motion.home-a-preloader-gate
        - ref-001.performance.home-a-why-spectacle-cost
  counterexamples: []
  validation:
    - ref: val-001
      result: consistent
      observations:
        - val-001.motion.home-a-intro-loader
        - val-001.motion.home-a-why-loader-hides-content
      note: "analyst (home): full-screen loader still covers the page at 4.2 s in the lab; the wordmark, statement and navigation could render before the WebGL scene"
  external:
    - source_id: webdev-vitals
      note: LCP ≤ 2.5 s
evidence_count: 1
confidence: low
confidence_basis: 1 reference + Web Vitals threshold
created: 2026-10-02
updated: 2026-10-04
history:
  - version: 0.1.0
    date: 2026-10-02
    change: created from extraction-split evidence (Phase D synthesis)
  - version: 0.1.0
    date: 2026-10-04
    change: "validation (val-001, val-002; val-003 unavailable): 1 consistent, 0 inconsistent, 0 inconclusive"
