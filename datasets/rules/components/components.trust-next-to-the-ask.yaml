id: components.trust-next-to-the-ask
kind: principle
domain: components
title: Put proof and promises next to the ask
status: provisional
since: 0.1.0
statement: Place trust signals — ratings, customer logos, delivery promises, price and terms disclosure — immediately around the first call to action rather than in a later section.
when:
  page_goal:
    - conversion
consider:
  - rating line above the headline
  - logo strip closing the first viewport
  - delivery/payment promise strip above the hero (MENA commerce)
  - starting price + disclaimer under the hero statement
verify:
  - claims are factual and sourced in the brief
  - small trust text still meets contrast
avoid_when:
  - editorial and public-service pages
rationale: "Four conversion references put proof in the first viewport: ratings (fintech), customer logos (payments), delivery/gift/payment promises (luxury commerce), price and production timing (automotive)."
trade_offs:
  - clutter if every signal is shown at once
depends_on:
  - industry
  - user-intent
evidence:
  supporting:
